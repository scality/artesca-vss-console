name: build-console

# Triggers: push to main when console sources or this workflow change.
# PRs that touch the same paths run lint + tests + build but do not push.
#
# GHCR image: ghcr.io/scality/isv-nvidia-nvidia-vss/console
# Two tags on push to main:
#   :latest
#   :sha-<7-char short SHA>
on:
  push:
    branches:
      - main
    paths:
      - "console/**"
      - ".github/workflows/build-console.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/build-console.yml"

concurrency:
  group: build-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Shallow clone — full history not needed for lint/test/build.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Lint
        working-directory: console
        run: npm run lint

      - name: Unit tests (vitest CI mode)
        working-directory: console
        run: npm run test -- --run

      # `next build` with output: "standalone" also performs tsc type-checking.
      # A non-zero exit here catches TS errors before the Docker build.
      - name: Build (type-check + Next.js build)
        working-directory: console
        run: npm run build

      # playwright.config.ts webServer boots `npm run start` in CI (port :8800)
      # using the .next output from the preceding build step — no separate server
      # start needed.
      - name: Install Playwright browsers
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: console
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: console/playwright-report/
          retention-days: 7

  build-and-push:
    needs: ci
    # Only run on push to main — skip on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Compute the short SHA for the image tag.
      # GITHUB_SHA is a fixed 40-char hex string set by GitHub Actions — safe
      # to slice via shell parameter expansion.
      - name: Compute short SHA
        id: sha
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the GITHUB_TOKEN — no personal access token needed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the multi-stage console image.
      # context: console/ so the Dockerfile has access to the Next.js source.
      # cache-from/cache-to: GitHub Actions cache for layer reuse across runs.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: console
          file: console/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/scality/isv-nvidia-nvidia-vss/console:latest
            ghcr.io/scality/isv-nvidia-nvidia-vss/console:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the pushed image ref and a ready-to-use kubectl rollout command.
      - name: Print image ref and rollout hint
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          IMAGE="ghcr.io/scality/isv-nvidia-nvidia-vss/console:sha-${SHORT_SHA}"
          echo "Pushed: ${IMAGE}"
          echo ""
          echo "To deploy on the ARTESCA node:"
          echo "  kubectl set image deployment/console console=${IMAGE} -n console"
          echo "  kubectl rollout status deployment/console -n console"
