name: secret-scan

# Deliberately NOT path-filtered, unlike `build-console`.
#
# A credential can land in any file — a manifest, a README, a test fixture, a
# workflow — so a scan that only runs when `src/**` changes is a scan that is
# absent for exactly the commits nobody is reviewing closely. This runs on every
# push and every pull request.
#
# This exists because GitHub's own push protection is unavailable here: enabling
# secret scanning on this repository is blocked by a GitHub enterprise policy
# (HTTP 422 on the repository settings API, measured 2026-08-13). Push protection
# refuses the commit; this only reports after the fact, which is strictly weaker —
# a secret caught here is already in the history and needs a rewrite, not a
# revert. If an enterprise owner lifts that policy, prefer push protection and
# keep this as the belt.
#
# Rules live in `.gitleaks.toml` at the repository root, including why the three
# fabricated values in this history are allowlisted by exact literal.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # `gitleaks git` walks every commit. The default shallow checkout would
          # scan one, and report clean while saying nothing about the history —
          # the failure mode this job exists to prevent.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned, and checksum-verified. The published action is not used: it
          # requires a GITLEAKS_LICENSE for repositories owned by an
          # organisation, which is a paid key this scan does not need.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: |
          # --redact so a real finding does not print the secret into a public
          # log, which would publish it more widely than the commit did.
          gitleaks git --no-banner --redact --verbose .
