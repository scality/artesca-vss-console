apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-data
  namespace: console
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Bind statically to the local PV created in 15-storage.yaml. MetalK8s
  # has no default StorageClass, so an omitted className leaves the PVC
  # Pending forever.
  storageClassName: console-local
