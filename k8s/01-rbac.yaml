---
# ServiceAccount used by the console pod to reach the K8s API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-sa
  namespace: console

---
# ClusterRole — cluster-scoped and genuinely read-only. No exec, no write verb.
#
# The reads are cluster-wide because the topology and diagnostics pages describe
# the whole node: they list namespaces to discover the layout, read events and
# pod status across it, and read nodes for capacity. Nothing here can change
# cluster state.
#
# `pods/exec` is deliberately NOT here — see the console-exec Role note at the
# bottom of this file. Exec is the one capability in this manifest that a reader
# copies without asking why, and it belongs in one namespace, not all of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps", "services", "events", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
# GPU utilisation comes from Prometheus (the DCGM ServiceMonitor); this is the
# node-capacity fallback for when Prometheus is unreachable.
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-reader
subjects:
- kind: ServiceAccount
  name: console-sa
  namespace: console

---
# Secrets in the console's OWN namespace, named one by one.
#
# The /secrets page reads rotation status (get) and the Rotate action writes
# (patch). Both act on exactly the two Secrets below, so both are pinned with
# resourceNames — a grant on `secrets` with no names lets the console read and
# rewrite every Secret in its namespace, which is more than this page does.
#
# `list` is deliberately absent. Nothing in the console lists Secrets: the only
# API calls are readNamespacedSecret and patchNamespacedSecret, both by name.
# It matters beyond tidiness — `list` cannot be restricted by resourceNames, so
# granting it would hand back the enumeration the two rules above withhold.
#
# Workload-namespace Secrets are a separate grant; see the console-writer note
# at the bottom of this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: console-secrets
  namespace: console
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["console-auth", "console-ssh"]
  verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: console-secrets-binding
  namespace: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: console-secrets
subjects:
- kind: ServiceAccount
  name: console-sa
  namespace: console

# ─────────────────────────────────────────────────────────────────────────────
# Two more Roles are generated per namespace at deploy time, because the
# namespace name is not known until then (Helm puts the workload in
# vss-<profile>; the legacy layout splits it across four). Declaring them here
# with a literal namespace would fail to apply whenever VSS_NAMESPACE differs.
# Both are in k8s/02-workload-rbac.yaml.example, which is the same content with
# the namespace left as a placeholder — apply that if you deploy by hand.
#
#   console-exec    — pods/exec, in the VSS namespace ONLY.
#   console-writer  — the config writes, in each workload namespace.
#
# ⚠ console-exec is the grant to think about before copying this manifest.
# Exec into a pod is arbitrary code execution in that pod, so it is scoped to
# the one namespace that needs it rather than granted cluster-wide. What needs
# it, exhaustively: `df` on the VST recording cache, `pg_isready` and two
# `psql` counts against the bundled Postgres, and `redis-cli ping`/`info` —
# every one of them in CLUSTER.vst.namespace. Remove the Role and the console
# still runs; the storage-cache figure, the Postgres row and the Redis row on
# /topology go unknown.
#
# GPU state is NOT a reason for exec: /api/gpu reads Prometheus, and the
# /diagnostics nvidia-smi test runs over SSH to the node.
#
# `get` as well as `create` on pods/exec: since k8s 1.31 dropped SPDY the
# client streams exec over a WebSocket, whose upgrade is an HTTP GET. `create`
# remains for the legacy POST path.
#
# ⚠ Auditing this needs `kubectl auth can-i <verb> pods --subresource=exec`.
# The `pods/exec` spelling silently answers about `pods` instead — measured on
# kubectl 1.33 it reports `create` denied and `list` allowed, which is wrong
# both ways and reads as authoritative.
