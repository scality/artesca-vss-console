---
# ServiceAccount used by the console pod to reach the K8s API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-sa
  namespace: console

---
# ClusterRole — cluster-scoped, read-only.
# Includes pods/exec (create) for nvidia-smi and nodes/metrics for GPU fallback.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps", "services", "events", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-reader
subjects:
- kind: ServiceAccount
  name: console-sa
  namespace: console

---
# Secrets access scoped to the console's OWN namespace — the /secrets page reads
# status (get) and the Rotate action writes (patch) console-auth / console-ssh /
# console-aws. Namespaced (not cluster-wide) to keep the blast radius small;
# workload-namespace secret access is granted by the dynamic console-writer Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: console-secrets
  namespace: console
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: console-secrets-binding
  namespace: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: console-secrets
subjects:
- kind: ServiceAccount
  name: console-sa
  namespace: console

# Per-namespace console-writer Role + RoleBinding are generated dynamically
# by deploy-console.sh from the resolved workload-namespace list (Helm or
# legacy layout). They are NOT declared here to avoid namespace-mismatch
# errors when the active VSS_NAMESPACE differs from a hardcoded name.
