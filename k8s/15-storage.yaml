# Local storage for the console's SQLite DB + clip cache.
#
# MetalK8s ships no default StorageClass and all built-in ones use
# kubernetes.io/no-provisioner (static binding). Mirror the rtvi/vst
# pattern: a per-workload SC + PV bound to a known host directory. Host
# path is created by scripts/deploy-console.sh via salt-call before apply.
# PV survives stop/start but not a full teardown + relaunch.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: console-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: console-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: console-local
  volumeMode: Filesystem
  local:
    path: /srv/scality/console-data
  # nodeAffinity is substituted to the live node hostname by
  # scripts/deploy-console.sh (same trick as rtvi's 19-storage.yaml).
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - ip-10-42-1-78.us-west-2.compute.internal
