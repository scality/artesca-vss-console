---
# console — Next.js 16 operator dashboard.
# Deployed as a single replica; the pipeline keeps running if this pod restarts.
# Exposed on hostPort :8800 — the EC2 Security Group restricts inbound access
# to whitelisted CIDRs managed from the /settings → Network access panel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      serviceAccountName: console-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        # fsGroup so the non-root user can read group-readable (0440) secret
        # mounts (config-store key.json, ssh PEM) — without it the projected
        # secret files are root:root 0400 and reads fail with EACCES.
        fsGroup: 1001
      containers:
      - name: console
        # Overridden at deploy time — deploy-console.sh sideloads the image onto
        # the node and rewrites this to a console.local: tag with
        # imagePullPolicy: Never. Pin a :sha-<short-sha> for a registry pull.
        image: ghcr.io/scality/artesca-vss-console:latest
        ports:
        - name: http
          containerPort: 8800
          hostPort: 8800
          protocol: TCP
        envFrom:
        - configMapRef:
            name: console-env
        - secretRef:
            name: console-auth
        - secretRef:
            name: console-aws
        # Object-store credentials, contract from scripts/install-objectstore/.
        # Uses objectstore-creds — the recordings-account root key, which owns
        # the nvidia-vss-recordings bucket the storage probes (topology +
        # overview KPI) read. ARTESCA mints account-scoped root keys with no
        # cross-account bucket policy, so a key can only read its own account's
        # bucket; the recordings key is same-account for the bucket the console
        # actually probes. Remapped to OBJECTSTORE_* names so they don't collide
        # with AWS_ACCESS_KEY_ID from console-aws (scoped to
        # ec2:*SecurityGroupIngress only — would 403 against S3). The S3 client
        # in console/src/lib/s3.ts reads OBJECTSTORE_ACCESS_KEY_ID /
        # OBJECTSTORE_SECRET_ACCESS_KEY explicitly. Marked optional so the
        # console pod still starts in OBJECTSTORE=none / single-bucket modes
        # where this Secret may not be provisioned.
        env:
        - name: OBJECTSTORE_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: objectstore-creds
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: OBJECTSTORE_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: objectstore-creds
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        volumeMounts:
        - name: console-data
          mountPath: /data
        # Uploaded test footage. Written here by the console, read by the
        # test-footage-server (same namespace, same node) which republishes each
        # file as RTSP on demand. See 30-test-footage.yaml.
        - name: test-footage
          mountPath: /footage
        - name: camera-sim-ssh-key
          mountPath: /etc/camera-sim
          readOnly: true
        - name: config-store-key
          mountPath: /etc/config-store
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          # readOnlyRootFilesystem is false — Next.js writes to .next/cache
          # at runtime and next-auth uses /tmp for session scratch files.
          readOnlyRootFilesystem: false
        startupProbe:
          httpGet:
            path: /api/health/self
            port: 8800
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 8800
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health/self
            port: 8800
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 3
      volumes:
      - name: console-data
        persistentVolumeClaim:
          claimName: console-data
      - name: test-footage
        persistentVolumeClaim:
          claimName: test-footage-data
      - name: camera-sim-ssh-key
        secret:
          secretName: console-ssh
          defaultMode: 0440
      - name: config-store-key
        secret:
          secretName: config-store-rw
          # 0440 + pod fsGroup 1001 → readable by the non-root console user
          defaultMode: 0440

---
# ClusterIP Service — lets in-cluster callers (health probes, future AI agents)
# reach the console without going through the NodePort / hostPort path.
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: console
spec:
  selector:
    app: console
  ports:
  - name: http
    port: 8800
    targetPort: 8800
    protocol: TCP
  type: ClusterIP
