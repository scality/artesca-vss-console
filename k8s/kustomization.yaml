# Apply with isv-labs' scripts/deploy-console.sh, not kubectl apply -k directly:
# the script creates the workload namespaces, generates the per-namespace
# console-writer Role + RoleBinding, and substitutes the image and the node,
# camera-sim and S3 placeholders before calling kustomize.
# Prerequisites:
#   - the console Secrets present in the cluster (deploy-console.sh generates
#     them into the lab instance's own directory on first deploy)
#   - AWS credentials + EC2 SG ID available for console-aws Secret
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- 00-namespace.yaml
- 01-rbac.yaml
- 11-configmap-env.yaml
- 12-pvc.yaml
- 15-storage.yaml
- 20-console.yaml
# Not optional, despite being a feature: 20-console.yaml mounts the
# test-footage-data PVC this file declares, and Kubernetes has no optional PVC
# volume — so the console pod does not schedule without it. Leaving it out is
# what made the manifest smoke-test unable to pass (ISVD-596).
- 30-test-footage.yaml

labels:
- pairs:
    scality.com/component: console
  includeSelectors: false

# This repository's CI publishes :latest and :sha-<short-sha> on every push to
# main. deploy-console.sh replaces the image outright with a sideloaded
# console.local: tag, so this pins what a direct `kubectl apply -k` would pull.
images:
- name: ghcr.io/scality/artesca-vss-console
  newTag: latest
