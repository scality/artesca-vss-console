# `kubectl apply -k k8s/` is the deploy path. It does NOT do four things that the
# pod needs, each of which stops it from starting — see the README's "Deploying to
# a cluster" section:
#   - the console Secrets must already exist (copy 10-secrets.yaml.example to
#     k8s/console-secrets.yaml, which is gitignored, fill it in, apply it first)
#   - AWS/S3 credentials + EC2 SG ID for the console-aws Secret
#   - a console-writer Role + RoleBinding in each vss-<profile> namespace the
#     console patches; 01-rbac.yaml only covers namespace console
#   - the image below has to be overridden with the one you built, and the node,
#     camera-sim and S3 placeholders substituted
#
# Scality's labs automate all of that from their own tooling, which is why this
# file historically assumed it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- 00-namespace.yaml
- 01-rbac.yaml
- 11-configmap-env.yaml
- 12-pvc.yaml
- 15-storage.yaml
- 20-console.yaml
# Not optional, despite being a feature: 20-console.yaml mounts the
# test-footage-data PVC this file declares, and Kubernetes has no optional PVC
# volume — so the console pod does not schedule without it. Leaving it out is
# what made the manifest smoke-test unable to pass (ISVD-596).
- 30-test-footage.yaml

labels:
- pairs:
    scality.com/component: console
  includeSelectors: false

# This repository's CI publishes :latest and :sha-<short-sha> on every push to
# main. deploy-console.sh replaces the image outright with a sideloaded
# console.local: tag, so this pins what a direct `kubectl apply -k` would pull.
images:
- name: ghcr.io/scality/artesca-vss-console
  newTag: latest
