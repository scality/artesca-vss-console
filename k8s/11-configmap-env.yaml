apiVersion: v1
kind: ConfigMap
metadata:
  name: console-env
  namespace: console
data:
  # Comma-separated list of namespaces the console monitors and can write to.
  KUBE_NAMESPACES: "vst,rtvi,agent,alerts,demo-data,pyramid-ingress"

  # Kafka — Redpanda StatefulSet "redpanda" in namespace "rtvi" (k8s/rtvi/20-redpanda.yaml).
  # All pods use hostNetwork; the console uses the headless service DNS name.
  # Override if the cluster routes Kafka differently.
  KAFKA_BROKERS: "redpanda.rtvi.svc.cluster.local:9092"

  # Redis — Deployment "redis" in namespace "vst" (k8s/vst/21-redis.yaml).
  # Used by alert-worker, rtvi-vlm, and rtvi-embed for shared state.
  # The original default (alerts-redis.alerts) was wrong — Redis lives in vst.
  REDIS_URL: "redis://redis.vst.svc.cluster.local:6379"

  # ARTESCA S3 endpoint and bucket for video clip storage.
  # Replace <base-domain> with the ARTESCA base domain used at install time
  # (the --base-domain flag passed to artesca-installer deploy).
  S3_ENDPOINT: "https://s3.<base-domain>"
  S3_BUCKET: "vss-video"

  # Camera-sim EC2 — SSH connection details.
  # CAMERA_SIM_HOST      : public IP or DNS name of the camera-sim instance.
  #                        Also used as the mediamtx host (port 9997) unless
  #                        MEDIAMTX_API_URL is set explicitly.
  # CAMERA_SIM_SSH_USER  : OS user on the camera-sim instance (Ubuntu AMI default).
  # CAMERA_SIM_SSH_KEY_PATH: path inside the console pod to the mounted SSH key.
  CAMERA_SIM_HOST: "<camera-sim-public-ip>"
  CAMERA_SIM_SSH_USER: "ubuntu"
  CAMERA_SIM_SSH_KEY_PATH: "/etc/camera-sim/id_ed25519"

  # mediamtx REST API base URL (port 9997 on the camera-sim host).
  # Defaults to http://<CAMERA_SIM_HOST>:9997 if not set.
  # MEDIAMTX_API_URL: "http://<camera-sim-public-ip>:9997"

  # VST sensor-ms API base URL.  sensor-ms binds port 30000 (k8s/vst/30-sensor-ms.yaml).
  # The original .env.example used port 5010, which is wrong.
  VST_SENSOR_URL: "http://sensor-ms.vst.svc.cluster.local:30000/api/v1/live/sensor"

  # alert-worker HTTP API (k8s/alerts/20-alert-worker.yaml, hostPort 9101).
  # Headless Service defined in k8s/alerts/21-alert-worker-service.yaml.
  ALERT_WORKER_URL: "http://alert-worker.alerts.svc.cluster.local:9101"

  # Prometheus — ARTESCA kube-prometheus-stack in artesca-monitoring namespace.
  # Service name "prometheus-operated" confirmed on the live cluster (headless,
  # StatefulSet prometheus-prometheus-ltm, endpoint 10.233.138.187:9090).
  PROMETHEUS_URL: "http://prometheus-operated.artesca-monitoring.svc.cluster.local:9090"

  # SQLite database directory — profiles, audit log, SG whitelist.
  # Backed by PVC console-data (5 Gi, ReadWriteOnce).
  CONSOLE_DATA_DIR: "/data"

  # Preview NIM endpoint — NVILA-Lite-2B sharing GPU 0 with the primary NIM.
  # Used by /api/prompt/preview (dry-run prompt evaluation without touching
  # the live inference path). Leave as-is if using the default in-cluster URL.
  # Flag: ASSUMED — no nim-preview Deployment found in k8s/rtvi/; confirm name at deploy.
  NIM_PREVIEW_ENDPOINT: "http://nvila-lite-preview.rtvi.svc.cluster.local:8000"

  # Model catalog selection — drives which card in console/src/data/model-catalog.json
  # is rendered as primary / preview on the Prompt page. Matched against ModelCard.image
  # (exact) first, then partial match on image or displayName.
  # cosmos-reason1-7b is the L4-capable primary (cosmos-reason2-8b needs >56 GB VRAM).
  NIM_CURRENT_MODEL: "cosmos-reason1-7b"
  NIM_PREVIEW_MODEL: "nvila-lite-2b"

  # next-auth base URL — must be reachable from inside the pod for callbacks.
  # For in-cluster callers (health probes, AI agents) use the ClusterIP service.
  # If the console is reached from a laptop via NodePort, set NEXTAUTH_URL to
  # http://<ARTESCA-public-IP>:8800 instead.
  NEXTAUTH_URL: "http://console.console.svc.cluster.local:8800"
